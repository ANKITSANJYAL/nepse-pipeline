[project]
name = "nepse-pipeline"
version = "0.1.0"
description = "NEPSE live + historical market data pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16",
    "pydantic>=2.7",
    "nepse @ git+https://github.com/basic-bgnr/NepseUnofficialApi.git",
]

# Only the hosted/publish path needs the Hub client; local capture does not.
[project.optional-dependencies]
hub = ["huggingface_hub>=0.34"]

[project.scripts]
nepse = "nepse_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
